<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>MV SAK</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#07080d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 8%,rgba(70,50,255,.75),transparent 42%),radial-gradient(circle at 92% 28%,rgba(220,50,140,.6),transparent 40%),radial-gradient(circle at 8% 62%,rgba(20,150,230,.6),transparent 42%),radial-gradient(circle at 90% 92%,rgba(30,200,110,.5),transparent 38%),#07080d}
.app{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 16px calc(env(safe-area-inset-bottom,0px) + 36px)}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 18px;gap:8px}
.hd b{font-size:24px;font-weight:600}.hd span{font-size:13px;color:#c9cde0}
.gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;margin-bottom:24px}
.lb{font-size:12px;color:#c9cde0;margin:0 0 6px 12px}
.sec{font-size:14px;font-weight:600;margin:4px 4px 12px}
.g{position:relative;border-radius:30px;padding:5px;background:linear-gradient(150deg,rgba(255,255,255,.38),rgba(255,255,255,.06) 45%,rgba(255,255,255,.2));-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 4px rgba(255,255,255,.2),0 14px 26px -10px var(--c),0 3px 8px rgba(0,0,0,.45);min-width:0}
.g::after{content:"";position:absolute;left:20px;right:20px;top:2px;height:8px;border-radius:8px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,0));opacity:.7;pointer-events:none}
.ln{position:relative;height:46px;border-radius:25px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bg);box-shadow:inset 0 -10px 16px -6px var(--c),inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(0,0,0,.35);font-size:14px;font-weight:500;overflow:hidden;min-width:0}
.ln input{all:unset;width:100%;font-size:17px;font-weight:500;color:#fff}
.full{margin-bottom:18px}
.nm input{all:unset;flex:1;font-size:16px;font-weight:500;text-transform:uppercase;min-width:0}
.cd{border-radius:26px}
.cd .ln{height:auto;min-height:108px;border-radius:21px;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:12px 13px;gap:7px}
.k{font-size:13px;opacity:.85}.big{font-size:25px;font-weight:600}.sm{font-size:11px;opacity:.8}
.bd{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#35e060;color:#04260f}
.bd.no{background:#ff6b78;color:#3a0309}
.vd{margin-bottom:16px}.vd .ln{justify-content:center;font-size:15px}
svg{display:block}
</style>
</head>
<body>
<div class="app">
  <div class="hd"><b>MV SAK</b><span>(Stock Analysis Kit)</span></div>

  <div class="g full" style="--bg:linear-gradient(#2c2f3c,#0d0e14);--c:#a79bff">
    <div class="ln nm">
      <input id="nm" value="HINDALCO" aria-label="Stock name" autocapitalize="characters">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </div>
  </div>

  <div class="gr">
    <div><div class="lb">CMP</div><div class="g" style="--c:#4ddc7a"><div class="ln" style="--bg:linear-gradient(#17382a,#06120b);--c:#4ddc7a"><input id="cmp" inputmode="decimal" value="886.65" aria-label="CMP"></div></div></div>
    <div><div class="lb">EPS</div><div class="g" style="--c:#ff9a2e"><div class="ln" style="--bg:linear-gradient(#5a3410,#150b03);--c:#ff9a2e"><input id="eps" inputmode="decimal" value="73.71" aria-label="EPS"></div></div></div>
    <div><div class="lb">Assumed growth %</div><div class="g" style="--c:#ff5a3c"><div class="ln" style="--bg:linear-gradient(#4a1f14,#130708);--c:#ff5a3c"><input id="gr" inputmode="decimal" value="38" aria-label="Assumed growth percent"></div></div></div>
    <div><div class="lb">Expected PE</div><div class="g" style="--c:#8a6bff"><div class="ln" style="--bg:linear-gradient(#35248a,#0e0a2b);--c:#8a6bff"><input id="pe" inputmode="decimal" value="10.7" aria-label="Expected PE"></div></div></div>
  </div>

  <div class="sec">Result</div>
  <div class="g vd" id="vd" style="--c:#4ddc7a"><div class="ln" id="vl" style="--bg:linear-gradient(#17382a,#06120b);--c:#4ddc7a"><span id="vt">Discount at all 3 levels</span></div></div>

  <div class="gr">
    <div class="g cd" style="--c:#4ddc7a"><div class="ln" style="--bg:linear-gradient(#17382a,#06120b);--c:#4ddc7a"><div class="k">X/2</div><div class="big" id="l2">0</div><div class="bd" id="d2">Discount</div></div></div>
    <div class="g cd" style="--c:#27c4ff"><div class="ln" style="--bg:linear-gradient(#103a45,#05121a);--c:#27c4ff"><div class="k">X/3</div><div class="big" id="l3">0</div><div class="bd" id="d3">Discount</div></div></div>
    <div class="g cd" style="--c:#8a6bff"><div class="ln" style="--bg:linear-gradient(#2a1650,#080c1a 60%,#14385a);--c:#8a6bff"><div class="k">X/4</div><div class="big" id="l4">0</div><div class="bd" id="d4">Discount</div></div></div>
    <div class="g cd" style="--c:#ff5fb0"><div class="ln" style="--bg:linear-gradient(#7a2a5c,#230a1b);--c:#ff5fb0"><div class="k">Target</div><div class="big" id="tg">0</div><div class="sm" id="sub"></div></div></div>
  </div>
</div>
<script>
(function(){
  var ids=['nm','cmp','eps','gr','pe'];
  function $(id){return document.getElementById(id)}
  function v(id){return parseFloat($(id).value)||0}
  function f(n){return Math.round(n).toLocaleString('en-IN')}
  function save(){try{var o={};ids.forEach(function(i){o[i]=$(i).value});localStorage.setItem('mvsak',JSON.stringify(o))}catch(e){}}
  function load(){try{var o=JSON.parse(localStorage.getItem('mvsak')||'null');if(o)ids.forEach(function(i){if(o[i]!==undefined)$(i).value=o[i]})}catch(e){}}
  function calc(){
    var c=v('cmp'),e=v('eps'),g=v('gr'),p=v('pe');
    var e5=e*Math.pow(1+g/100,5),t=e5*p,n=0;
    $('tg').textContent=f(t);
    $('sub').textContent='EPS in 5 yrs '+e5.toFixed(2)+' x PE '+p;
    [2,3,4].forEach(function(k){
      var l=t/k,d=l>0?(l-c)/l*100:0,b=$('d'+k);
      $('l'+k).textContent=f(l);
      if(d>0){n++;b.textContent='Discount '+d.toFixed(2)+'%';b.className='bd'}
      else{b.textContent='Premium '+Math.abs(d).toFixed(2)+'%';b.className='bd no'}
    });
    $('vt').textContent=n==3?'Discount at all 3 levels':n==0?'No discount at any level':'Discount at '+n+' of 3 levels';
    var col=n==3?'#4ddc7a':n==0?'#ff5a6a':'#ffb02e';
    $('vd').style.setProperty('--c',col);$('vl').style.setProperty('--c',col);
    save();
  }
  load();
  ids.forEach(function(i){$(i).addEventListener('input',calc)});
  calc();
})();
</script>
</body>
</html>
